apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: tribunal-kubeflow-flow-
  annotations:
    pipelines.kubeflow.org/kfp_sdk_version: 2.x
spec:
  entrypoint: tribunal-kubeflow-flow
  templates:
    - name: tribunal-kubeflow-flow
      steps:
        - - name: start
            template: start
        - - name: generate-and-validate-data
            template: generate-and-validate-data
        - - name: feature-engineering
            template: feature-engineering
        - - name: train-model
            template: train-model
        - - name: end
            template: end

    - name: start
      container:
        image: python:3.10-slim
        command: ["python", "pipeline_tribunal.py", "start", ...]
        
    - name: generate-and-validate-data
      container:
        image: python:3.10-slim
        command: ["python", "pipeline_tribunal.py", "generate_and_validate_data", ...]

    # Demais templates para feature_engineering, train_model e end...